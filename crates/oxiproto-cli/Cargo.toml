[package]
name            = "oxiproto-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description     = "OxiProto CLI: compile .proto files to plain Rust structs without protoc"
keywords        = ["protobuf", "codegen", "cli", "protoc"]
categories      = ["command-line-utilities", "development-tools"]

[[bin]]
name = "oxiproto-cli"
path = "src/main.rs"

# protoc-argv-compatible descriptor-set generator. Third-party build scripts
# (prost-build, tonic-build, ...) shell out to `protoc` only to produce a
# FileDescriptorSet; pointing `PROTOC` at this binary removes their dependency
# on a C++ protoc install. It is a separate binary rather than an
# `oxiproto-cli` subcommand precisely because `PROTOC` is invoked as a bare
# executable carrying protoc's own argv, with no room for a subcommand word.
[[bin]]
name = "oxiproto-protoc"
path = "src/bin/oxiproto-protoc.rs"

[features]
default = []

[dependencies]
anstyle          = "1"
clap             = { workspace = true }
clap_complete    = "4"
oxiproto-core    = { workspace = true }
oxiproto-build   = { workspace = true, features = ["native-parser"] }
prost-build      = { workspace = true }
oxiproto-codegen = { workspace = true }
oxiproto-reflect = { workspace = true }
oxiproto-json    = { workspace = true }
prost            = { workspace = true }
prost-reflect    = { workspace = true }
prost-types      = { workspace = true }
serde_json       = { workspace = true }
clap_mangen      = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
serde_json = { workspace = true }

[[bench]]
name    = "startup"
harness = false
